name: Rx2GO static validation

# This workflow deliberately does not access a real RX2GO environment.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript type check
        run: npm run typecheck
      - name: Discover Playwright tests without running them
        run: npm run test:list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rx2go-validation-output
          path: |
            playwright-report/
            test-results/
            allure-results/
            reports/

