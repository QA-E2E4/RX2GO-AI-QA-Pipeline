version: 1
topic: risk_based_test_coverage
scope: all Jira Smart QA runs
core:
  - Jira acceptance criteria are mandatory.
  - Testing must not stop at literal acceptance/happy path.
additional_coverage:
  positive: true
  negative: true
  boundary: when_relevant
  regression: true
  integration: when_relevant
  data_consistency: when_relevant
  resilience_reload_repeat: when_relevant
selection:
  - Prefer P0/P1 checks directly connected to changed behavior.
  - Use Knowledge Retrieval for historical regressions and automation lessons.
  - Do not add unrelated broad smoke tests.
  - Respect latest narrowed Jira-comment scope.
  - Respect data mutation permission.
result_rules:
  - Directly impacted additional regressions may affect overall result.
  - Advisory unrelated findings must not distort Jira PASS/FAIL.
  - Unsafe or impossible additional checks must be SKIP/BLOCKED with reason.
knowledge_messages:
  read_failure:
    behavior: continue_with_local_memory
    user_notification: required
  local_write_failure:
    user_notification: required
  github_push_failure:
    behavior: preserve_local_commit_and_product_result
    user_notification: required

